<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KetoStickers — Carte des stickers</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>🌍 KetoStickers</h1>
  <p>La carte des endroits où on a laissé notre trace</p>
</div>

<div id="counter-badge">0 stickers</div>

<div id="hint">Reste appuyé sur la carte pour ajouter un sticker</div>

<!-- Modale d'ajout -->
<div id="add-backdrop" class="modal-backdrop">
  <div class="modal-card">
    <h2>Nouveau sticker 📍</h2>
    <p class="subtitle" id="add-subtitle">Raconte où et comment tu l'as posé</p>
    <form id="add-form">
      <div class="role-toggle">
        <button type="button" class="active" id="role-poseur" data-role="poseur">Tu as posé</button>
        <button type="button" id="role-spectateur" data-role="spectateur">Tu as vu</button>
      </div>

      <label for="pseudo">Ton pseudo</label>
      <input type="text" id="pseudo" required maxlength="50" placeholder="Ex : Piggy">

      <label for="description">Description</label>
      <textarea id="description" required maxlength="500" placeholder="Ex : collé sur un lampadaire près de la tour Eiffel"></textarea>

      <label for="photo">Photo (facultatif)</label>
      <input type="file" id="photo" accept="image/*" capture="environment">

      <p class="error-msg" id="add-error"></p>

      <div class="btn-row">
        <button type="button" class="btn-secondary" id="cancel-add">Annuler</button>
        <button type="submit" class="btn-primary" id="submit-add">Poser le sticker</button>
      </div>
    </form>
  </div>
</div>

<!-- Modale d'info -->
<div id="info-backdrop" class="modal-backdrop">
  <div class="modal-card" id="info-content"></div>
</div>

<!-- Modale "Je l'ai vu !" -->
<div id="sighting-backdrop" class="modal-backdrop">
  <div class="modal-card">
    <h2>Je l'ai vu ! 👀</h2>
    <p class="subtitle">Ajoute-toi à la liste des spectateurs</p>
    <form id="sighting-form">
      <label for="sighting-pseudo">Ton pseudo</label>
      <input type="text" id="sighting-pseudo" required maxlength="50" placeholder="Ex : Piggy">

      <label for="sighting-photo">Photo (facultatif)</label>
      <input type="file" id="sighting-photo" accept="image/*" capture="environment">

      <p class="error-msg" id="sighting-error"></p>

      <div class="btn-row">
        <button type="button" class="btn-secondary" id="cancel-sighting">Annuler</button>
        <button type="submit" class="btn-primary" id="submit-sighting">Valider</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
